name: image

on:
  pull_request:
  push:
    branches: [master]
    tags: ['*']

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Refuse a tag that is not on master
        if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - name: Refuse a poslib pin that is not on poslib's master
        run: |
          pin=$(sed -n 's/^ARG POSLIB_COMMIT=//p' Dockerfile)
          git clone -q --bare https://github.com/ClankaOperatingSystem/poslib.git "$RUNNER_TEMP/poslib.git"
          git -C "$RUNNER_TEMP/poslib.git" merge-base --is-ancestor "$pin" master
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # Each image's layers are kept in the Actions cache, so the apt
      # and package layers are rebuilt when the Dockerfile changes and
      # not otherwise. The published build's scope holds both platforms.
      # The test build, one platform, reads that scope and writes a
      # scope of its own: were it to write the published scope, the
      # index it left would hold one platform, and the published build
      # would build arm64 again. A pull request reads master's cache
      # and writes its own.
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: CLANKOS_COMMIT=${{ github.sha }}
          load: true
          tags: clankos:test
          cache-from: |
            type=gha,scope=clankos
            type=gha,scope=clankos-test
          cache-to: type=gha,mode=max,scope=clankos-test
      - uses: docker/build-push-action@v7
        with:
          context: clankos-skills
          load: true
          tags: clankos-skills:test
          cache-from: |
            type=gha,scope=clankos-skills
            type=gha,scope=clankos-skills-test
          cache-to: type=gha,mode=max,scope=clankos-skills-test
      # A pull request runs the tests its changes bear on, which
      # test/select chooses from the diff against its base. A push to
      # master or a tag runs them all.
      - name: Test the commands in the image
        env:
          CLANKOS_IMAGE: clankos:test
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" | test/select > "$RUNNER_TEMP/tests"
            echo "== $(wc -l < "$RUNNER_TEMP/tests") of $(ls test/*.sh | wc -l) tests selected"
            [ -s "$RUNNER_TEMP/tests" ] || exit 0
            xargs test/run < "$RUNNER_TEMP/tests"
          else
            test/run
          fi
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # master is published as latest; a tag is published under its own
      # name and does not move latest.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/clankaoperatingsystem/clankos
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: CLANKOS_COMMIT=${{ github.sha }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=clankos
          cache-to: type=gha,mode=max,scope=clankos
      # The image install runs the skills CLI in, under the same tags,
      # so that clankos-run finds it beside the ClankOS image.
      - id: skills-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/clankaoperatingsystem/clankos-skills
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
      - uses: docker/build-push-action@v7
        with:
          context: clankos-skills
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.skills-meta.outputs.tags }}
          labels: ${{ steps.skills-meta.outputs.labels }}
          cache-from: type=gha,scope=clankos-skills
          cache-to: type=gha,mode=max,scope=clankos-skills
