name: host

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@master
        with:
          version: 30.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: make check
